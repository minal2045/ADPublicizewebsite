{% include "AdminHome/sidebar.html" %}

<div class="content">
  <h3 class="mb-4">Publishers</h3>
  <table class="table table-striped">
    <tr>
      <th>ID</th><th>Name</th><th>Company</th><th>Email</th><th>Role</th>
    </tr>
    {% for p in data %}
    <tr>
      <td>{{ p.pubid }}</td>
      <td>{{ p.fname }} {{ p.lname }}</td>
      <td>{{ p.cname }}</td>
      <td>{{ p.emailid }}</td>
      <td>{{ p.role }}</td>
      <td>
        <a href="{% url 'edit_publisher' p.pubid %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'delete_publisher' p.pubid %}" class="btn btn-sm btn-danger"
           onclick="return confirm('Are you sure?')">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
