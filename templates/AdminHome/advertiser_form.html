{% extends "AdminHome/sidebar.html" %}
{% block title %}Advertiser Form{% endblock %}
{% block content %}
<nav class="navbar bg-white shadow-sm p-3 mb-3 rounded">
  <span class="h5">{% if advertiser %}Edit{% else %}Add{% endif %} Advertiser</span>
</nav>

<form method="POST" class="shadow-sm p-4 bg-white rounded">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6">
      <label>First Name</label>
      <input type="text" name="fname" value="{{ advertiser.fname }}" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label>Last Name</label>
      <input type="text" name="lname" value="{{ advertiser.lname }}" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label>Gender</label>
      <select name="gender" class="form-control" required>
        <option value="Male" {% if advertiser.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if advertiser.gender == "Female" %}selected{% endif %}>Female</option>
        <option value="Other" {% if advertiser.gender == "Other" %}selected{% endif %}>Other</option>
      </select>
    </div>
    <div class="col-md-6">
      <label>Role</label>
      <input type="text" name="role" value="{{ advertiser.role }}" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label>Email</label>
      <input type="email" name="emailid" value="{{ advertiser.emailid }}" class="form-control" required>
    </div>
    <div class="col-md-6">
      <label>Password</label>
      <input type="text" name="password" value="{{ advertiser.password }}" class="form-control" required>
    </div>
  </div>
  <button class="btn btn-success mt-3">Save</button>
</form>
{% endblock %}
