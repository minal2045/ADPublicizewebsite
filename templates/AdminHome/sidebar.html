<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Admin Panel{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    .sidebar { height:100vh; width:230px; position:fixed; background:#343a40; padding-top:20px; }
    .sidebar a { display:block; padding:12px; text-decoration:none; color:#ddd; }
    .sidebar a:hover { background:#495057; color:white; }
    .content { margin-left:230px; padding:20px; }
  </style>
</head>

<body>
  <div class="sidebar">
    <h4 class="text-center text-white mb-4">Admin Panel</h4>
    <a href="{% url 'admin_dashboard' %}">Dashboard</a>
    <a href="{% url 'admin_advertisers' %}">Advertisers</a>
    <a href="{% url 'admin_publishers' %}">Publishers</a>
    <a href="{% url 'admin_locations' %}">Locations</a>
    <a href="{% url 'admin_requests' %}">Requests</a>
    <a href="{% url 'admin_logout' %}" class="text-danger">Logout</a>
  </div>

  <div class="content">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
